spring:
  application:
    name: joblens-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/joblens?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${DB_USERNAME:joblens}
    password: ${DB_PASSWORD:joblens}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/joblens}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs


joblens:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-to-a-long-random-value}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
